services:
  api:
    build: ./api
    ports:
      - "8081:8000"
    volumes:
      - ./api:/var/www/html
      - /var/www/html/vendor
    env_file:
      - ./api/.env
    depends_on:
      - db

  app:
    build: ./app
    ports:
      - "5173:5173"
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - api

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
